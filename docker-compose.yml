name: kbguard-test-fixtures

# Works unchanged against a remote Docker engine too (DOCKER_HOST=ssh://...)
# — the containers just bind to that remote machine's interfaces instead of
# localhost. See docs/project/contributing.md for pointing the test suite
# at a non-local host via KBGUARD_TEST_PG_HOST / KBGUARD_TEST_QDRANT_HOST.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kbguard
      POSTGRES_PASSWORD: kbguard
      POSTGRES_DB: kbguard_test
    ports:
      # Not 5432 (Postgres's own default, likely already taken) and not
      # 5433 either (also turned out to collide — with a local Postgres
      # instance on at least one dev machine this project was built on).
      # Pick a different host port here if 5434 is taken too; the test
      # suite always reads it from KBGUARD_TEST_PG_PORT, never assumes it.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbguard -d kbguard_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
