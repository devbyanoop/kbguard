name: kbguard-test-fixtures

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kbguard
      POSTGRES_PASSWORD: kbguard
      POSTGRES_DB: kbguard_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbguard -d kbguard_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
