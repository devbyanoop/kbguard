[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbguard"
version = "0.1.0"
description = "Knowledge-base QA and evals for RAG systems, across any vector database."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Anoop Singh" }]
keywords = ["rag", "vector-database", "testing", "evals", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyarrow>=16.0",
    # pyarrow's own wheel metadata declares no numpy floor at all -- the
    # real compatibility requirement (pyarrow >=16 needs NumPy 2.x) is
    # only enforced inside pyarrow's C extension at import time, not by
    # pip's resolver. A looser floor here (numpy>=1.26) let pip leave an
    # already-installed, pre-numpy-2 environment untouched -- satisfied
    # on paper, but pyarrow then raised "pyarrow requires NumPy 2.0 or
    # newer" on the very first `kbguard` invocation. Confirmed by hand:
    # reproduced for real against a real pre-existing numpy 1.26.4
    # install, fixed by raising this floor so pip is forced to upgrade
    # it instead of leaving it alone.
    "numpy>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    # Used at runtime by evals/target.py's RagTarget (an HTTP target.type
    # constructs a real httpx.Client() at __init__ time, not lazily) --
    # not just by tests via httpx.MockTransport. Previously lived only
    # under the `dev` extra, which meant a genuinely clean `pip install
    # kbguard` crashed on `kbguard --help` itself (cli.py imports
    # evals.target unconditionally). Lightweight, no heavy transitive
    # deps (unlike faiss/sentence-transformers), so a core dependency,
    # not a lazy import behind an extra.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/devbyanoop/kbguard"
Repository = "https://github.com/devbyanoop/kbguard"
Issues = "https://github.com/devbyanoop/kbguard/issues"
Documentation = "https://github.com/devbyanoop/kbguard/tree/main/docs"

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
qdrant = ["qdrant-client>=1.9"]
pinecone = ["pinecone>=5.0"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
# langchain-community pinned below 0.4: ragas's own metadata doesn't
# constrain it at all, and pip resolving the latest (0.4.x) breaks ragas
# outright -- ragas.llms.base imports langchain_community.chat_models
# .vertexai.ChatVertexAI, a module that no longer exists there, making a
# fresh `pip install ragas` literally unimportable. Confirmed by hand,
# not assumed; 0.3.31 (the newest pre-0.4 release) still has it.
ragas = ["ragas>=0.1", "langchain-community<0.4"]
deepeval = ["deepeval>=1.0"]
litellm = ["litellm>=1.40"]
sentence-transformers = ["sentence-transformers>=2.7"]
dedup = ["faiss-cpu>=1.8", "datasketch>=1.6"]
nlp = ["spacy>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "python-dotenv>=1.0",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
    "pyarrow-stubs>=17.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# everything needed to run the full test suite locally / in CI
all = [
    "kbguard[chroma,pgvector,qdrant,pinecone,langchain,llamaindex,ragas,deepeval,litellm,sentence-transformers,dedup,nlp,dev,docs]",
]

[project.entry-points."kbguard.adapters"]
# built-in adapters register the same way a third-party plugin would —
# no special-casing of "native" vs. "community" stores.
chroma = "kbguard.adapters.chroma:ChromaAdapter"
pgvector = "kbguard.adapters.pgvector:PgVectorAdapter"
qdrant = "kbguard.adapters.qdrant:QdrantAdapter"
pinecone = "kbguard.adapters.pinecone:PineconeAdapter"
bridge_langchain = "kbguard.adapters.bridge_langchain:LangChainBridgeAdapter"

[project.entry-points."kbguard.checks"]
# Same registration mechanism as adapters — a third-party check package
# registers here the same way, no special-casing.
duplicates = "kbguard.checks.duplicates:DuplicatesCheck"
stale_versions = "kbguard.checks.stale_versions:StaleVersionsCheck"
chunking_damage = "kbguard.checks.chunking_damage:ChunkingDamageCheck"
contradictions = "kbguard.checks.contradictions:ContradictionsCheck"

[project.scripts]
kbguard = "kbguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kbguard"]

[tool.pytest.ini_options]
testpaths = ["tests", "contract_tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...)/typer.Argument(...) in a parameter default is typer's
# own required idiom — it builds the CLI parser by inspecting the function
# signature's defaults. Not a mutable-default footgun (B008's actual
# target); every CLI command in cli.py uses this pattern.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kbguard"]

# Optional third-party extras (installed only if the user opts into that
# extra — some lazily imported inside a function, like sentence_transformers/
# litellm; some imported at module level in a file that's itself only
# loaded when its plugin is actually selected via registry.py, like
# datasketch in checks/duplicates.py) that don't ship type stubs mypy can
# find, and no types-* stub package exists for either. Add an entry here,
# not a `# type: ignore` at each call site, the first time a new one of
# these is imported somewhere in src/kbguard.
#
# follow_imports = "skip" (not just ignore_missing_imports): these need to
# behave identically whether or not the extra happens to be installed in a
# given environment. ignore_missing_imports only helps when the import
# can't be found at all — once sentence-transformers (pulling in torch) was
# actually installed here, mypy started trying to deeply analyze its real,
# enormous type surface and hung/crashed (exit code 4, mypy's fatal-error
# code) rather than reporting a normal pass/fail. follow_imports = "skip"
# tells mypy to never dive into these modules' actual source, regardless of
# installation state.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "litellm.*", "datasketch.*", "deepeval.*"]
ignore_missing_imports = true
follow_imports = "skip"

# sklearn ships no py.typed marker and no inline types at all (confirmed
# by hand), but unlike the extras above it's neither huge enough to
# crash mypy nor imported anywhere performance-sensitive — plain
# ignore_missing_imports is enough, no need for follow_imports = "skip".
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
